<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Parham panel preview">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.5" stop-color="#140404"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="pred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ee3a3a"/>
    </linearGradient>
    <linearGradient id="pchart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee3a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ee3a3a" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="992" height="612" rx="24" fill="url(#pbg)" stroke="#ee3a3a" stroke-width="4"/>
  <circle cx="880" cy="80" r="130" fill="#ee3a3a" fill-opacity="0.10" filter="url(#pglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="560" r="110" fill="#ff6b6b" fill-opacity="0.06" filter="url(#pglow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- topbar -->
  <rect x="230" y="28" width="742" height="64" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <rect x="246" y="44" width="52" height="32" rx="8" fill="url(#pred)" stroke="#0b0b0f" stroke-width="2.5"/>
  <text x="272" y="67" text-anchor="middle" font-size="20" font-weight="900" fill="#0b0b0f">P</text>
  <text x="312" y="67" font-size="24" font-weight="900" fill="#ffffff">Parham</text>
  <rect x="640" y="46" width="220" height="28" rx="8" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="1.5"/>
  <text x="652" y="65" font-size="14" fill="#ee3a3a">720 users online</text>
  <circle cx="930" cy="60" r="14" fill="url(#pred)">
    <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- sidebar -->
  <rect x="28" y="28" width="186" height="564" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <rect x="44" y="48" width="154" height="40" rx="9" fill="url(#pred)"/>
  <text x="60" y="74" font-size="16" font-weight="800" fill="#ffffff">Dashboard</text>
  <text x="60" y="122" font-size="16" font-weight="600" fill="#8a8a93">Users</text>
  <text x="60" y="162" font-size="16" font-weight="600" fill="#8a8a93">Inbounds</text>
  <text x="60" y="202" font-size="16" font-weight="600" fill="#8a8a93">Routing</text>
  <text x="60" y="242" font-size="16" font-weight="600" fill="#8a8a93">Activity</text>
  <text x="60" y="282" font-size="16" font-weight="600" fill="#8a8a93">Bot</text>
  <text x="60" y="322" font-size="16" font-weight="600" fill="#8a8a93">Settings</text>
  <rect x="44" y="520" width="154" height="52" rx="9" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="2"/>
  <text x="60" y="542" font-size="13" font-weight="700" fill="#ee3a3a">Made with 🔥</text>
  <text x="60" y="560" font-size="13" font-weight="700" fill="#ee3a3a">by Parham</text>

  <!-- stat cards -->
  <g font-weight="800">
    <rect x="230" y="108" width="240" height="110" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
    <text x="250" y="138" font-size="14" fill="#8a8a93">CPU LOAD</text>
    <text x="250" y="176" font-size="34" font-weight="900" fill="#ee3a3a">23%</text>
    <rect x="250" y="190" width="200" height="8" rx="4" fill="#0b0b0f"/>
    <rect x="250" y="190" width="46" height="8" rx="4" fill="url(#pred)"/>

    <rect x="482" y="108" width="240" height="110" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
    <text x="502" y="138" font-size="14" fill="#8a8a93">USERS ONLINE</text>
    <text x="502" y="176" font-size="34" font-weight="900" fill="#ffffff">720</text>
    <text x="502" y="198" font-size="13" fill="#ff6b6b">▲ 12% this week</text>

    <rect x="734" y="108" width="238" height="110" rx="14" fill="#16161d" stroke="#ee3a3a" stroke-width="2.5" filter="url(#pglow)"/>
    <text x="754" y="138" font-size="14" fill="#8a8a93">TRAFFIC TODAY</text>
    <text x="754" y="176" font-size="34" font-weight="900" fill="#ee3a3a">4.2 TB</text>
    <text x="754" y="198" font-size="13" fill="#ff6b6b">▲ 8% vs yesterday</text>
  </g>

  <!-- chart card -->
  <rect x="230" y="232" width="492" height="220" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <text x="250" y="262" font-size="16" font-weight="800" fill="#ffffff">Bandwidth — last 24h</text>
  <path d="M250 400 L300 370 L350 378 L400 340 L450 350 L500 310 L550 322 L600 280 L650 295 L702 250 L702 400 Z" fill="url(#pchart)"/>
  <path d="M250 400 L300 370 L350 378 L400 340 L450 350 L500 310 L550 322 L600 280 L650 295 L702 250" stroke="#ee3a3a" stroke-width="3.5" stroke-linecap="round" filter="url(#pglow)"/>
  <circle cx="702" cy="250" r="6" fill="#ff6b6b" filter="url(#pglow)"/>

  <!-- users card -->
  <rect x="734" y="232" width="238" height="220" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <text x="754" y="262" font-size="16" font-weight="800" fill="#ffffff">Top users</text>
  <circle cx="764" cy="292" r="7" fill="#ee3a3a"/><text x="780" y="297" font-size="14" fill="#e8e8ea">ali — 84 GB</text>
  <circle cx="764" cy="324" r="7" fill="#ff6b6b"/><text x="780" y="329" font-size="14" fill="#e8e8ea">sara — 61 GB</text>
  <circle cx="764" cy="356" r="7" fill="#8a8a93"/><text x="780" y="361" font-size="14" fill="#e8e8ea">reza — 45 GB</text>
  <circle cx="764" cy="388" r="7" fill="#8a8a93"/><text x="780" y="393" font-size="14" fill="#e8e8ea">mina — 32 GB</text>
  <rect x="754" y="404" width="198" height="30" rx="8" fill="url(#pred)"/>
  <text x="853" y="424" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">+ New user</text>

  <!-- bottom bar -->
  <rect x="230" y="466" width="742" height="126" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <text x="250" y="498" font-size="16" font-weight="800" fill="#ffffff">Inbounds</text>
  <rect x="250" y="512" width="150" height="52" rx="9" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="2"/>
  <text x="266" y="534" font-size="14" font-weight="800" fill="#ee3a3a">VLESS :443</text>
  <text x="266" y="552" font-size="12" fill="#8a8a93">● running</text>
  <rect x="412" y="512" width="150" height="52" rx="9" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
  <text x="428" y="534" font-size="14" font-weight="800" fill="#e8e8ea">VMESS :443</text>
  <text x="428" y="552" font-size="12" fill="#8a8a93">● running</text>
  <rect x="574" y="512" width="150" height="52" rx="9" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
  <text x="590" y="534" font-size="14" font-weight="800" fill="#e8e8ea">TROJAN :443</text>
  <text x="590" y="552" font-size="12" fill="#8a8a93">○ standby</text>
  <rect x="736" y="512" width="216" height="52" rx="9" fill="url(#pred)" filter="url(#pglow)"/>
  <text x="844" y="544" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">Deploy on Railway</text>
</svg>
