<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Parham users page preview">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.5" stop-color="#140404"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="ured" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ee3a3a"/>
    </linearGradient>
    <filter id="uglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="992" height="612" rx="24" fill="url(#ubg)" stroke="#ee3a3a" stroke-width="4"/>
  <circle cx="880" cy="540" r="120" fill="#ee3a3a" fill-opacity="0.08" filter="url(#uglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- topbar -->
  <rect x="230" y="28" width="742" height="64" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <rect x="246" y="44" width="52" height="32" rx="8" fill="url(#ured)" stroke="#0b0b0f" stroke-width="2.5"/>
  <text x="272" y="67" text-anchor="middle" font-size="20" font-weight="900" fill="#0b0b0f">P</text>
  <text x="312" y="67" font-size="24" font-weight="900" fill="#ffffff">Users</text>
  <rect x="700" y="42" width="150" height="36" rx="9" fill="url(#ured)" filter="url(#uglow)"/>
  <text x="775" y="66" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">+ New user</text>
  <rect x="860" y="42" width="96" height="36" rx="9" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
  <text x="908" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e8ea">Search</text>

  <!-- sidebar -->
  <rect x="28" y="28" width="186" height="564" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <text x="60" y="74" font-size="16" font-weight="600" fill="#8a8a93">Dashboard</text>
  <rect x="44" y="88" width="154" height="40" rx="9" fill="url(#ured)"/>
  <text x="60" y="114" font-size="16" font-weight="800" fill="#ffffff">Users</text>
  <text x="60" y="162" font-size="16" font-weight="600" fill="#8a8a93">Inbounds</text>
  <text x="60" y="202" font-size="16" font-weight="600" fill="#8a8a93">Routing</text>
  <text x="60" y="242" font-size="16" font-weight="600" fill="#8a8a93">Activity</text>
  <text x="60" y="282" font-size="16" font-weight="600" fill="#8a8a93">Bot</text>
  <text x="60" y="322" font-size="16" font-weight="600" fill="#8a8a93">Settings</text>
  <rect x="44" y="520" width="154" height="52" rx="9" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="2"/>
  <text x="60" y="542" font-size="13" font-weight="700" fill="#ee3a3a">720 online</text>
  <text x="60" y="560" font-size="13" font-weight="700" fill="#ee3a3a">● live</text>

  <!-- summary strip -->
  <g font-weight="800">
    <rect x="230" y="108" width="240" height="86" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
    <text x="250" y="136" font-size="13" fill="#8a8a93">TOTAL USERS</text>
    <text x="250" y="172" font-size="30" font-weight="900" fill="#ffffff">1,284</text>
    <rect x="230" y="108" width="240" height="86" rx="14" fill="none" stroke="#ee3a3a" stroke-width="2" stroke-opacity="0.0"/>
    <rect x="482" y="108" width="240" height="86" rx="14" fill="#16161d" stroke="#ee3a3a" stroke-width="2.5" filter="url(#uglow)"/>
    <text x="502" y="136" font-size="13" fill="#8a8a93">ONLINE NOW</text>
    <text x="502" y="172" font-size="30" font-weight="900" fill="#ee3a3a">720
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <rect x="734" y="108" width="238" height="86" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
    <text x="754" y="136" font-size="13" fill="#8a8a93">DATA SERVED</text>
    <text x="754" y="172" font-size="30" font-weight="900" fill="#ffffff">38 TB</text>
  </g>

  <!-- table -->
  <rect x="230" y="208" width="742" height="384" rx="14" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <rect x="230" y="208" width="742" height="52" rx="14" fill="#0b0b0f"/>
  <g font-size="13" font-weight="700" fill="#8a8a93">
    <text x="262" y="240">USER</text>
    <text x="470" y="240">USAGE</text>
    <text x="680" y="240">STATUS</text>
    <text x="830" y="240">ACTIONS</text>
  </g>

  <g font-size="15" font-weight="700">
    <!-- row 1 -->
    <circle cx="268" cy="292" r="14" fill="url(#ured)"/>
    <text x="268" y="297" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">A</text>
    <text x="292" y="290" fill="#ffffff">ali</text>
    <text x="292" y="308" font-size="12" font-weight="600" fill="#8a8a93">84 / 100 GB</text>
    <rect x="470" y="284" width="170" height="10" rx="5" fill="#0b0b0f"/>
    <rect x="470" y="284" width="143" height="10" rx="5" fill="url(#ured)"/>
    <rect x="680" y="278" width="96" height="28" rx="14" fill="#ee3a3a" fill-opacity="0.15" stroke="#ee3a3a" stroke-width="2"/>
    <text x="728" y="297" text-anchor="middle" font-size="13" fill="#ee3a3a">● online</text>
    <rect x="830" y="278" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="856" y="297" text-anchor="middle" font-size="13" fill="#e8e8ea">QR</text>
    <rect x="890" y="278" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="916" y="297" text-anchor="middle" font-size="13" fill="#e8e8ea">⧉</text>

    <!-- row 2 -->
    <circle cx="268" cy="352" r="14" fill="#3a3a44"/>
    <text x="268" y="357" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">S</text>
    <text x="292" y="350" fill="#ffffff">sara</text>
    <text x="292" y="368" font-size="12" font-weight="600" fill="#8a8a93">61 / 100 GB</text>
    <rect x="470" y="344" width="170" height="10" rx="5" fill="#0b0b0f"/>
    <rect x="470" y="344" width="104" height="10" rx="5" fill="url(#ured)"/>
    <rect x="680" y="338" width="96" height="28" rx="14" fill="#ee3a3a" fill-opacity="0.15" stroke="#ee3a3a" stroke-width="2"/>
    <text x="728" y="357" text-anchor="middle" font-size="13" fill="#ee3a3a">● online</text>
    <rect x="830" y="338" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="856" y="357" text-anchor="middle" font-size="13" fill="#e8e8ea">QR</text>
    <rect x="890" y="338" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="916" y="357" text-anchor="middle" font-size="13" fill="#e8e8ea">⧉</text>

    <!-- row 3 -->
    <circle cx="268" cy="412" r="14" fill="#3a3a44"/>
    <text x="268" y="417" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">R</text>
    <text x="292" y="410" fill="#ffffff">reza</text>
    <text x="292" y="428" font-size="12" font-weight="600" fill="#8a8a93">45 / 50 GB</text>
    <rect x="470" y="404" width="170" height="10" rx="5" fill="#0b0b0f"/>
    <rect x="470" y="404" width="153" height="10" rx="5" fill="#ff6b6b"/>
    <rect x="680" y="398" width="96" height="28" rx="14" fill="#3a3a44" fill-opacity="0.4" stroke="#5a5a66" stroke-width="2"/>
    <text x="728" y="417" text-anchor="middle" font-size="13" fill="#8a8a93">○ offline</text>
    <rect x="830" y="398" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="856" y="417" text-anchor="middle" font-size="13" fill="#e8e8ea">QR</text>
    <rect x="890" y="398" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="916" y="417" text-anchor="middle" font-size="13" fill="#e8e8ea">⧉</text>

    <!-- row 4 -->
    <circle cx="268" cy="472" r="14" fill="url(#ured)"/>
    <text x="268" y="477" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">M</text>
    <text x="292" y="470" fill="#ffffff">mina</text>
    <text x="292" y="488" font-size="12" font-weight="600" fill="#8a8a93">12 / 100 GB</text>
    <rect x="470" y="464" width="170" height="10" rx="5" fill="#0b0b0f"/>
    <rect x="470" y="464" width="20" height="10" rx="5" fill="url(#ured)"/>
    <rect x="680" y="458" width="96" height="28" rx="14" fill="#ee3a3a" fill-opacity="0.15" stroke="#ee3a3a" stroke-width="2"/>
    <text x="728" y="477" text-anchor="middle" font-size="13" fill="#ee3a3a">● online</text>
    <rect x="830" y="458" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="856" y="477" text-anchor="middle" font-size="13" fill="#e8e8ea">QR</text>
    <rect x="890" y="458" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="916" y="477" text-anchor="middle" font-size="13" fill="#e8e8ea">⧉</text>

    <!-- row 5 -->
    <circle cx="268" cy="532" r="14" fill="#3a3a44"/>
    <text x="268" y="537" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">K</text>
    <text x="292" y="530" fill="#ffffff">kia</text>
    <text x="292" y="548" font-size="12" font-weight="600" fill="#8a8a93">expired</text>
    <rect x="470" y="524" width="170" height="10" rx="5" fill="#0b0b0f"/>
    <rect x="470" y="524" width="170" height="10" rx="5" fill="#5a5a66"/>
    <rect x="680" y="518" width="96" height="28" rx="14" fill="#5a1a1a" stroke="#ef4444" stroke-width="2"/>
    <text x="728" y="537" text-anchor="middle" font-size="13" fill="#ff8a8a">expired</text>
    <rect x="830" y="518" width="52" height="28" rx="7" fill="url(#ured)"/>
    <text x="856" y="537" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">↻</text>
    <rect x="890" y="518" width="52" height="28" rx="7" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
    <text x="916" y="537" text-anchor="middle" font-size="13" fill="#e8e8ea">✕</text>
  </g>
</svg>
