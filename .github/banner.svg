<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Parham">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.5" stop-color="#12121a"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="pred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#ee3a3a"/>
    </linearGradient>
    <linearGradient id="redtext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ee3a3a" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ee3a3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="988" height="328" rx="30" fill="url(#bg)" stroke="#ee3a3a" stroke-width="5"/>
  <rect x="6" y="6" width="988" height="328" rx="30" fill="url(#dots)"/>
  <circle cx="900" cy="40" r="150" fill="#ee3a3a" fill-opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="320" r="140" fill="#ff6b6b" fill-opacity="0.07" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="300" r="120" fill="#ef4444" fill-opacity="0.05" filter="url(#glow)"/>
  <circle cx="700" cy="90" r="4" fill="#ff6b6b">
    <animate attributeName="cy" values="110;40;110" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="70" r="3" fill="#ee3a3a">
    <animate attributeName="cy" values="120;30;120" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="250" r="3.5" fill="#ff8a8a">
    <animate attributeName="cy" values="280;200;280" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <line x1="40" y1="60" x2="150" y2="60" stroke="#ee3a3a" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="850" y1="290" x2="960" y2="290" stroke="#ee3a3a" stroke-width="2" stroke-opacity="0.25"/>

  <g transform="translate(80 112)" filter="url(#softshadow)">
    <rect x="0" y="0" width="118" height="118" rx="26" fill="url(#pred)" stroke="#0b0b0f" stroke-width="5"/>
    <text x="59" y="88" text-anchor="middle" font-size="72" font-weight="900" fill="#0b0b0f">P</text>
  </g>

  <text x="228" y="152" font-size="92" font-weight="900" letter-spacing="-4" fill="url(#redtext)">Parham</text>
  <rect x="232" y="180" width="600" height="42" rx="11" fill="url(#pred)"/>
  <text x="254" y="209" font-size="22" font-weight="800" letter-spacing="0.6" fill="#0b0b0f">XRAY-CORE VPN PANEL &#183; ONE-CLICK ON RAILWAY</text>

  <g font-size="18" font-weight="800">
    <g transform="translate(232 238)">
      <rect x="0" y="0" width="116" height="38" rx="10" fill="#ee3a3a" fill-opacity="0.12" stroke="#ee3a3a" stroke-width="2.5"/>
      <text x="58" y="25" text-anchor="middle" fill="#ee3a3a">VLESS</text>
    </g>
    <g transform="translate(360 238)">
      <rect x="0" y="0" width="116" height="38" rx="10" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-width="2.5"/>
      <text x="58" y="25" text-anchor="middle" fill="#ff6b6b">VMESS</text>
    </g>
    <g transform="translate(488 238)">
      <rect x="0" y="0" width="116" height="38" rx="10" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2.5"/>
      <text x="58" y="25" text-anchor="middle" fill="#ef4444">TROJAN</text>
    </g>
  </g>
</svg>
