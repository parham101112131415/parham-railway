<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Parham subscription page preview">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.5" stop-color="#140404"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="sred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ee3a3a"/>
    </linearGradient>
    <linearGradient id="schart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee3a3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ee3a3a" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="992" height="612" rx="24" fill="url(#sbg)" stroke="#ee3a3a" stroke-width="4"/>
  <circle cx="120" cy="100" r="120" fill="#ee3a3a" fill-opacity="0.09" filter="url(#sglow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="540" r="110" fill="#ff6b6b" fill-opacity="0.06" filter="url(#sglow)"/>

  <!-- desktop browser chrome -->
  <rect x="60" y="60" width="560" height="500" rx="18" fill="#16161d" stroke="#000" stroke-width="2.5"/>
  <rect x="60" y="60" width="560" height="48" rx="18" fill="#0b0b0f"/>
  <circle cx="88" cy="84" r="7" fill="#ef4444"/>
  <circle cx="110" cy="84" r="7" fill="#3a3a44"/>
  <circle cx="132" cy="84" r="7" fill="#3a3a44"/>
  <rect x="160" y="72" width="380" height="24" rx="12" fill="#16161d" stroke="#3a3a44" stroke-width="1.5"/>
  <text x="176" y="89" font-size="13" fill="#8a8a93">parham.up.railway.app/sub/9f3k…</text>

  <rect x="90" y="130" width="120" height="120" rx="16" fill="#ffffff"/>
  <g fill="#0b0b0f">
    <rect x="106" y="146" width="88" height="88"/>
    <rect x="116" y="156" width="68" height="68" fill="#ffffff"/>
    <rect x="126" y="166" width="48" height="48"/>
  </g>
  <circle cx="214" cy="146" r="16" fill="url(#sred)" filter="url(#sglow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="222" y="270" font-size="26" font-weight="900" fill="#ffffff">ali's plan</text>
  <text x="222" y="294" font-size="14" fill="#8a8a93">VLESS · WS · TLS :443</text>

  <rect x="222" y="310" width="376" height="86" rx="12" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="2"/>
  <text x="242" y="338" font-size="13" fill="#8a8a93">DATA LEFT</text>
  <text x="242" y="370" font-size="28" font-weight="900" fill="#ee3a3a">16 GB <tspan font-size="14" fill="#8a8a93">of 100 GB</tspan></text>
  <rect x="420" y="330" width="150" height="12" rx="6" fill="#16161d"/>
  <rect x="420" y="330" width="126" height="12" rx="6" fill="url(#sred)"/>
  <text x="420" y="362" font-size="13" fill="#ff6b6b">expires in 21 days</text>

  <path d="M100 470 L160 450 L220 456 L280 430 L340 438 L400 410 L460 420 L520 390 L580 400 L598 380 L598 500 L100 500 Z" fill="url(#schart)"/>
  <path d="M100 470 L160 450 L220 456 L280 430 L340 438 L400 410 L460 420 L520 390 L580 400 L598 380" stroke="#ee3a3a" stroke-width="3" stroke-linecap="round" filter="url(#sglow)"/>
  <text x="100" y="532" font-size="13" fill="#8a8a93">usage — last 30 days · total 84 GB</text>

  <!-- phone -->
  <rect x="660" y="80" width="280" height="520" rx="36" fill="#16161d" stroke="#000" stroke-width="3"/>
  <rect x="660" y="80" width="280" height="520" rx="36" fill="none" stroke="#ee3a3a" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="760" y="92" width="80" height="22" rx="11" fill="#0b0b0f"/>
  <rect x="684" y="130" width="88" height="88" rx="14" fill="#ffffff"/>
  <g fill="#0b0b0f">
    <rect x="696" y="142" width="64" height="64"/>
    <rect x="704" y="150" width="48" height="48" fill="#ffffff"/>
    <rect x="712" y="158" width="32" height="32"/>
  </g>
  <text x="786" y="160" font-size="20" font-weight="900" fill="#ffffff">Parham</text>
  <text x="786" y="182" font-size="13" fill="#8a8a93">tap to connect</text>
  <rect x="684" y="236" width="232" height="64" rx="12" fill="url(#sred)" filter="url(#sglow)"/>
  <text x="800" y="264" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">Copy sub link</text>
  <text x="800" y="286" text-anchor="middle" font-size="12" fill="#ffd7d7">vless://9f3k…@panel:443</text>
  <rect x="684" y="312" width="232" height="52" rx="12" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
  <text x="800" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#e8e8ea">Open in V2RayNG</text>
  <rect x="684" y="376" width="232" height="52" rx="12" fill="#0b0b0f" stroke="#3a3a44" stroke-width="2"/>
  <text x="800" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#e8e8ea">Open in Streisand</text>
  <rect x="684" y="440" width="232" height="52" rx="12" fill="#0b0b0f" stroke="#ee3a3a" stroke-width="2"/>
  <text x="800" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#ee3a3a">Show QR code</text>
  <text x="800" y="530" text-anchor="middle" font-size="13" fill="#8a8a93">16 GB left · 21 days</text>
  <rect x="724" y="546" width="152" height="10" rx="5" fill="#0b0b0f"/>
  <rect x="724" y="546" width="128" height="10" rx="5" fill="url(#sred)"/>
</svg>
